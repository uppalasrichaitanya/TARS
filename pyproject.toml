[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tars-agent"
version = "0.1.1"
description = "TARS — a disciplined, multi-session coding agent loop"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
dependencies = []
license = {file = "LICENSE"}
authors = [{name = "TARS contributors", email = "uppalasrichaitanya2007@gmail.com"}]
classifiers = ["License :: OSI Approved :: MIT License"]
urls = {Repository = "https://github.com/uppalasrichaitanya/TARS", Issues = "https://github.com/uppalasrichaitanya/TARS/issues"}

[project.optional-dependencies]
# Direct SDKs are first-class but optional: the adapter layer imports them
# lazily so `import tars.providers` works with neither installed, and
# OpenRouter needs no SDK at all (stdlib HTTP).
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
providers = ["anthropic>=0.40", "openai>=1.40"]
browser = ["playwright>=1.40"]
rich = ["rich>=13"]
dev = ["anthropic>=0.40", "openai>=1.40", "pytest>=8"]

[project.scripts]
# The verification gate is useful outside the loop entirely, so it ships as a
# command. `python -m tars.verification` is the same entry point.
tars-verify = "tars.verification.cli:main"
# Same for the readme writer: `python -m tars.readme` is the same entry point.
tars-readme = "tars.readme.cli:main"
# The memory writer, likewise. It ships as a command because draining the review
# queue is a thing a person does between loop runs, not something the loop can do
# for itself.
tars-memory = "tars.memory.cli:main"
# The loop itself - the product the other three were built to serve. Bare `tars`
# opens the REPL; subcommands are one-shot forms of the same phases.
tars = "tars.loop.cli:main"
tars-browser = "tars.browser.cli:main"

[tool.setuptools.packages.find]
include = ["tars"]

# The router's labeled set is read out of the installed package with
# importlib.resources, so it has to be declared or it ships only in the source
# tree — present in development, missing from the wheel.
[tool.setuptools.package-data]
"tars.router" = ["data/*.json"]
"tars" = ["loop/setup.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ruff formats Python inside markdown fences, and `README.md` is generated by
# `tars-readme` out of snippets copied verbatim from this repo — trailing-comment
# alignment included. The `path:line` citation under each snippet is only worth
# something if nothing rewrote it, which
# tests/test_readme_package.py::test_every_example_mined_from_this_repo_appears_verbatim_in_its_source
# pins. So the formatter skips the file rather than turning citations into
# paraphrases. `ruff check` still reads it, and has nothing to say about it.
[tool.ruff]
# Without this an exclude is ignored whenever a path is named explicitly, so
# `ruff format README.md` would quietly reformat the file anyway.
force-exclude = true

[tool.ruff.format]
exclude = ["README.md"]
